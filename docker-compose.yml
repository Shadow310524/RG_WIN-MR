services:
  postgres:
    image: postgres:16-alpine
    container_name: rgwin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rgwin_user
      POSTGRES_PASSWORD: rgwin_secure_password_dev
      POSTGRES_DB: rgwin_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rgwin_user -d rgwin_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rgwin_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://rgwin_user:rgwin_secure_password_dev@postgres:5432/rgwin_crm
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=rgwin-dev-secret-key-at-least-32-characters-long
      - HEALIX_API_BASE_URL=https://healix-rgwin.onrender.com/api/v1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
